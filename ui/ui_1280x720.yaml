            on_click:
              - lambda: |-
                  const char *ss = lv_textarea_get_text((lv_obj_t *) id(ta_ssid));
                  const char *ps = lv_textarea_get_text((lv_obj_t *) id(ta_pass));
                  const char *ci = lv_textarea_get_text((lv_obj_t *) id(ta_cid));
                  const char *se = lv_textarea_get_text((lv_obj_t *) id(ta_sec));
                  const char *at = lv_textarea_get_text((lv_obj_t *) id(ta_atc));
                  if (strlen(ci) > 0) {
                    auto c = id(opensky_client_id).make_call(); c.set_value(ci); c.perform();
                  }
                  if (strlen(se) > 0) {
                    auto c = id(opensky_client_secret).make_call(); c.set_value(se); c.perform();
                  }
                  if (at != nullptr) {
                    // 允許清空後寫回預設,避免殘留舊位址
                    std::string url = at;
                    while (!url.empty() && (url.back() == ' ' || url.back() == '/'))
                      url.pop_back();
                    auto c = id(voice_atc_url).make_call();
                    c.set_value(url.empty() ? "http://192.168.12.59:18650" : url);
                    c.perform();
                  }
                  if (strlen(ss) > 0 && strlen(ps) > 0)
                    wifi::global_wifi_component->save_wifi_sta(ss, ps);
