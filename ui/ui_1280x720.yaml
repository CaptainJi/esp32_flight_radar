        # 中心點(你的位置)
        - obj:
            x: 354
            y: 354
            width: 12
            height: 12
            radius: 6
            bg_color: 0x00E66E
            border_width: 0
        # NESW
        - label: { x: 348, y: 27,  text: "N", text_font: font_small, text_color: 0x00E66E }
        - label: { x: 672, y: 342, text: "E", text_font: font_small, text_color: 0x6E8273 }
        - label: { x: 351, y: 660, text: "S", text_font: font_small, text_color: 0x6E8273 }
        - label: { x: 30,  y: 342, text: "W", text_font: font_small, text_color: 0x6E8273 }

        # ===== 分隔線 =====
        - line:
            points: ["723, 0", "723, 720"]
            line_color: 0x006030
            line_width: 3

        # ===== 右:資訊欄 =====
        # MAP / ECHO / FADE / ATC / PWR / SYS 文字切換鈕(啟用=反白)
        # 六鈕須連續定義(寬 48、高 36、font_tiny)。勿把 PWR/SYS/ATC 放到 status_label 之後 —
        # 合併 map-tiles 後裁剪層/後掛物件會打亂命中,表現為點 SYS 卻觸發 PWR。
        - button:
            id: map_btn
            x: 739
            y: 150
            width: 84
            height: 54
            radius: 6
            checkable: true
            bg_color: 0x040C08
            border_width: 2
            border_color: 0x00A050
            checked:
              bg_color: 0xE8A020
              border_color: 0xE8A020
            widgets:
              - label:
                  id: map_btn_l
                  align: CENTER
                  text: "MAP"
                  text_font: font_tiny
                  text_color: 0x00C060
            on_click:
              - lambda: |-
                  bool on = lv_obj_has_state((lv_obj_t *) id(map_btn), LV_STATE_CHECKED);
                  id(map_on) = on;
                  lv_obj_set_style_text_color(id(map_btn_l),
                      lv_color_hex(on ? 0x201200 : 0x00C060), 0);
                  id(rebuild_base).execute();
        - button:
            id: echo_btn
            x: 830
            y: 150
            width: 84
            height: 54
            radius: 6
            checkable: true
            bg_color: 0x040C08
            border_width: 2
            border_color: 0x00A050
            checked:
              bg_color: 0xE8A020
              border_color: 0xE8A020
            widgets:
              - label:
                  id: echo_btn_l
                  align: CENTER
                  text: "ECHO"
                  text_font: font_tiny
                  text_color: 0x00C060
            on_click:
              - lambda: |-
                  bool on = lv_obj_has_state((lv_obj_t *) id(echo_btn), LV_STATE_CHECKED);
                  id(echo_on) = on;
                  lv_obj_set_style_text_color(id(echo_btn_l),
                      lv_color_hex(on ? 0x201200 : 0x00C060), 0);
                  id(rebuild_base).execute();   // 有舊回波幀就立即疊回顯示
                  if (on) id(echo_refresh).execute();   // 並排一次新抓取
        # FADE:真實雷達餘暉(慢速掃描 + 掃過顯影/淡出);關閉則常亮快掃
        - button:
            id: persist_btn
            x: 921
            y: 150
            width: 84
            height: 54
            radius: 6
            checkable: true
            bg_color: 0x040C08
            border_width: 2
            border_color: 0x00A050
            checked:
              bg_color: 0xE8A020
              border_color: 0xE8A020
            widgets:
              - label:
                  id: persist_btn_l
                  align: CENTER
                  text: "FADE"
                  text_font: font_tiny
                  text_color: 0x00C060
            on_click:
              - lambda: |-
                  bool on = lv_obj_has_state((lv_obj_t *) id(persist_btn), LV_STATE_CHECKED);
                  id(persist_on) = on;
                  lv_obj_set_style_text_color(id(persist_btn_l),
                      lv_color_hex(on ? 0x201200 : 0x00C060), 0);
                  // 切換時重置餘暉:開→等下次掃過再顯影;關→立刻常亮
                  if (id(slot_glow).size() != AC_SLOTS) id(slot_glow).assign(AC_SLOTS, 0.0f);
                  for (int i = 0; i < AC_SLOTS; i++) id(slot_glow)[i] = on ? 0.0f : 1.0f;
        # ATC 鈕:切換雷達顯示為 ATC 模式(方塊目標點/速度向量線/歷史軌跡/STCA 衝突告警)
        - button:
            id: atc_btn
            x: 1013
            y: 150
            width: 84
            height: 54
            radius: 6
            checkable: true
            bg_color: 0x040C08
            border_width: 2
            border_color: 0x00A050
            checked:
              bg_color: 0xE8A020
              border_color: 0xE8A020
            widgets:
              - label:
                  id: atc_btn_l
                  align: CENTER
                  text: "ATC"
                  text_font: font_tiny
                  text_color: 0x00C060
            on_click:
              - lambda: |-
                  bool on = lv_obj_has_state((lv_obj_t *) id(atc_btn), LV_STATE_CHECKED);
                  id(atc_on) = on;
                  lv_obj_set_style_text_color(id(atc_btn_l),
                      lv_color_hex(on ? 0x201200 : 0x00C060), 0);
              - script.execute: rebuild_base   # 底圖切換 ATC 靜態圖層(空域/跑道/機場/導航點)
              - script.execute: atc_panel_sync
        # PWR 鈕:切換螢幕背光(checked=熄滅)
        - button:
            id: pwr_btn
            x: 1104
            y: 150
            width: 84
            height: 54
            radius: 6
            checkable: true
            bg_color: 0x040C08
            border_width: 2
            border_color: 0x00A050
            checked:
              bg_color: 0xE8A020
              border_color: 0xE8A020
            widgets:
              - label:
                  id: pwr_btn_l
                  align: CENTER
                  text: "PWR"
                  text_font: font_tiny
                  text_color: 0x00C060
            on_click:
              - lambda: |-
                  if (millis() - id(wake_ms) < 1500) {
                    // 喚醒後防誤觸:把狀態復原成按下
                    lv_obj_add_state((lv_obj_t *) id(pwr_btn), LV_STATE_CHECKED);
                    lv_obj_set_style_text_color(id(pwr_btn_l), lv_color_hex(0x04180C), 0);
                    return;
                  }
                  bool on = lv_obj_has_state((lv_obj_t *) id(pwr_btn), LV_STATE_CHECKED);
                  lv_obj_set_style_text_color(id(pwr_btn_l),
                      lv_color_hex(on ? 0x201200 : 0x00C060), 0);
                  if (on) {
                    auto call = id(backlight).turn_on();
                    call.perform();
                  } else {
                    auto call = id(backlight).turn_off();
                    call.perform();
                  }
        # SYS 鈕:右下面板切換顯示系統資訊(CPU/RAM/PSRAM/FLASH)
        - button:
            id: info_btn
            x: 1196
            y: 150
            width: 84
            height: 54
            radius: 6
            checkable: true
            bg_color: 0x040C08
            border_width: 2
            border_color: 0x00A050
            checked:
              bg_color: 0xE8A020
              border_color: 0xE8A020
            widgets:
              - label:
                  id: info_btn_l
                  align: CENTER
                  text: "SYS"
                  text_font: font_tiny
                  text_color: 0x00C060
            on_click:
              - lambda: |-
                  bool on = lv_obj_has_state((lv_obj_t *) id(info_btn), LV_STATE_CHECKED);
                  id(info_on) = on;
                  lv_obj_set_style_text_color(id(info_btn_l),
                      lv_color_hex(on ? 0x201200 : 0x00C060), 0);
                  if (on) {
                    id(show_sysinfo).execute();
                  } else if (id(sel_cs_g).empty()) {
                    id(show_weather).execute();
                  } else {
                    // 恢復選取中航班:標頭先回填,詳情待下輪資料,航線重查
                    lv_label_set_text(id(sel_cs_l), id(sel_cs_g).c_str());
                    lv_label_set_text(id(sel_route_l), "ROUTE ...");
                    lv_label_set_text(id(sel_l1), "");
                    lv_label_set_text(id(sel_l2), "");
                    lv_label_set_text(id(sel_l3), "");
                    lv_label_set_text(id(sel_l4), "");
                    id(fetch_route).execute();
                  }
              - script.execute: atc_panel_sync
        # 亮度滑桿(僅 SYS 選單顯示,amber 配色):拖動即時調背光,存於 light 的 NVS 狀態
        #
        # 右下面板垂直預算(800 基準;改動請同步重算 + scale/fit):
        #   sys_tabbar    152..192 (取代標題列 SYSTEM;勿再蓋 sel_route/CPU 行)
        #   atc_panel     152..402 (h=250;頂部 40px 被 tabbar 蓋住)
        #   ATC 按鈕區    相對 y≥46 (絕對 ≥198;與 tabbar 底留 ≥4px)
        #   BRT 列        412..438
        #   status_label  448..
        - label:
            id: wifi_icon
            x: 1213
            y: 12
            text: "\uF1EB"
            text_font: montserrat_18
            text_color: 0x6E8273
            clickable: true
            on_click:
              - lambda: |-
                  char b[8];
                  (void) b;
                  lv_textarea_set_text((lv_obj_t *) id(ta_ssid),
                      wifi::global_wifi_component->wifi_ssid().c_str());
                  lv_textarea_set_text((lv_obj_t *) id(ta_pass), "");
                  lv_textarea_set_text((lv_obj_t *) id(ta_cid),
                      id(opensky_client_id).state.c_str());
                  lv_textarea_set_text((lv_obj_t *) id(ta_sec),
                      id(opensky_client_secret).state.c_str());
                  lv_textarea_set_text((lv_obj_t *) id(ta_atc),
                      id(voice_atc_url).state.c_str());
                  lv_keyboard_set_textarea(id(cfg_kb)->obj, (lv_obj_t *) id(ta_ssid));
                  radar_kb_focus((lv_obj_t *) id(ta_ssid));
              - lvgl.page.show: config_page
        - label:
            id: clock_label
            align: TOP_MID
            x: 360
            y: 6
            text: "--:--:--"
            text_font: font_clock
            text_color: 0x00E66E
            clickable: true
            on_click:
              # Tab5 以 RADAR_NO_ALARM 停响铃/巡检;闹钟页仍可进(不响)
              - lvgl.page.show: alarm_page
              - script.execute: hide_dd_symbols
              - script.execute: alarm_refresh
              - script.execute: spk_dd_refresh
              - lambda: |-
                  if (id(spk_ids).empty())
                    id(spk_scan).execute();
        - label:
            id: coords_label
            align: TOP_MID
            x: 360
            y: 87
            text: "--.----N  ---.----E"
            text_font: font_small
            text_color: 0x6E8273
            clickable: true
            on_click:
              - lambda: |-
                  char b[16];
                  snprintf(b, sizeof(b), "%.4f", id(home_lat).state);
                  lv_textarea_set_text((lv_obj_t *) id(ta_lat), b);
                  snprintf(b, sizeof(b), "%.4f", id(home_lon).state);
                  lv_textarea_set_text((lv_obj_t *) id(ta_lon), b);
                  // RANGE:內部一律存 km,英制時顯示 mi
                  snprintf(b, sizeof(b), "%.0f",
