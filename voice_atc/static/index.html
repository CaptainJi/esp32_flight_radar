<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Voice ATC 联调</title>
  <style>
    :root {
      --bg: #04180c;
      --fg: #d2e6d7;
      --accent: #00e66e;
      --amber: #e8a020;
      --panel: #0a2814;
      --border: #1a5a32;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh;
      font-family: "IBM Plex Sans", "Noto Sans SC", system-ui, sans-serif;
      background: radial-gradient(ellipse at 20% 0%, #0d3a1e, var(--bg) 55%);
      color: var(--fg);
    }
    main {
      max-width: 920px; margin: 0 auto; padding: 28px 20px 60px;
    }
    h1 {
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-weight: 500; letter-spacing: 0.04em;
      color: var(--accent); margin: 0 0 8px;
    }
    .sub { opacity: 0.75; margin-bottom: 24px; font-size: 0.95rem; }
    .grid {
      display: grid; gap: 16px;
      grid-template-columns: 1fr 1fr;
    }
    @media (max-width: 800px) { .grid { grid-template-columns: 1fr; } }
    section {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px; padding: 16px;
    }
    section h2 {
      margin: 0 0 12px; font-size: 0.85rem; color: var(--amber);
      text-transform: uppercase; letter-spacing: 0.08em;
    }
    label { display: block; font-size: 0.75rem; opacity: 0.7; margin: 8px 0 4px; }
    input, textarea, select {
      width: 100%; background: #02140a; color: var(--fg);
      border: 1px solid var(--border); border-radius: 6px;
      padding: 8px 10px; font: inherit;
    }
    textarea { min-height: 88px; resize: vertical; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
    button {
      background: var(--accent); color: #04180c; border: 0;
      border-radius: 6px; padding: 10px 14px; font-weight: 600;
      cursor: pointer;
    }
    button.secondary { background: transparent; color: var(--accent);
      border: 1px solid var(--accent); }
    button:disabled { opacity: 0.5; cursor: wait; }
    #log {
      white-space: pre-wrap; font-family: ui-monospace, monospace;
      font-size: 0.85rem; line-height: 1.45; min-height: 220px;
      max-height: 420px; overflow: auto;
    }
    .bubble-user { color: #8fd4a8; }
    .bubble-crew { color: #ffe08a; }
    .meta { font-size: 0.75rem; opacity: 0.6; margin-top: 8px; }
    .pill {
      display: inline-block; padding: 2px 8px; border-radius: 999px;
      border: 1px solid var(--border); font-size: 0.7rem; margin-right: 6px;
    }
  </style>
</head>
<body>
<main>
  <h1>VOICE ATC BRIDGE</h1>
  <p class="sub">先在此页用文本验证「选机上下文 → 火山方舟/智能对话 → TTS」。雷达固件对接同一 <code>/v1/radio/turn</code>。</p>

  <div class="grid">
    <section>
      <h2>Flight context</h2>
      <label>Callsign</label>
      <input id="cs" value="CPA123" />
      <label>Type / Reg</label>
      <div class="row">
        <input id="ty" value="B77W" style="flex:1" />
        <input id="reg" value="B-KPF" style="flex:1" />
      </div>
      <label>Route</label>
      <input id="route" value="VHHH-ZBAA" />
      <label>Alt m / Spd m/s / Track</label>
      <div class="row">
        <input id="alt" type="number" value="10668" style="flex:1" />
        <input id="spd" type="number" value="250" style="flex:1" />
        <input id="trk" type="number" value="015" style="flex:1" />
      </div>
      <label>Squawk / ICAO24</label>
      <div class="row">
        <input id="sq" value="6101" style="flex:1" />
        <input id="hex" value="780A1B" style="flex:1" />
      </div>
    </section>

    <section>
      <h2>Radio</h2>
      <div id="status" class="meta">checking /health …</div>
      <div class="row" style="margin-top:8px">
        <label style="display:flex;align-items:center;gap:6px;opacity:1;margin:0">
          <input id="fxRadio" type="checkbox" /> 无线电干扰
        </label>
        <label style="display:flex;align-items:center;gap:6px;opacity:1;margin:0">
          <input id="fxBg" type="checkbox" /> 飞行背景音
        </label>
        <label style="display:flex;align-items:center;gap:6px;opacity:1;margin:0">
          语言
          <select id="lang" style="width:auto;min-width:88px">
            <option value="zh" selected>中文</option>
            <option value="en">English</option>
          </select>
        </label>
      </div>
      <label>ATC / 你说</label>
      <textarea id="msg">CPA123, Beijing Control, say altitude.</textarea>
      <div class="row">
        <button type="button" class="secondary" data-p="电台检查，请回答">电台检查</button>
        <button type="button" class="secondary" data-p="请求下降到飞行高度 240">请求下降</button>
        <button type="button" class="secondary" data-p="Traffic in sight, maintaining present heading.">Traffic in sight</button>
      </div>
      <div class="row">
        <button id="send" type="button">发送（LLM + TTS）</button>
        <button id="clear" type="button" class="secondary">清空会话</button>
      </div>
      <label>会话记录</label>
      <div id="log"></div>
      <audio id="player" controls style="width:100%; margin-top:10px"></audio>
    </section>
  </div>
</main>
<script>
  let sessionId = "";
  let history = [];

  const logEl = document.getElementById("log");
  const statusEl = document.getElementById("status");
  const fxRadio = document.getElementById("fxRadio");
  const fxBg = document.getElementById("fxBg");
  const langEl = document.getElementById("lang");

  function append(role, text) {
    const who = role === "user" ? "YOU" : "CREW";
    logEl.textContent += `${who}: ${text}\n\n`;
    logEl.scrollTop = logEl.scrollHeight;
  }

  async function readJson(r) {
    const text = await r.text();
    if (!text) return {};
    try {
      return JSON.parse(text);
    } catch (_) {
      const snip = text.replace(/\s+/g, " ").slice(0, 180);
      throw new Error(`HTTP ${r.status} 非 JSON 响应: ${snip}`);
    }
  }

  function errText(j, fallback) {
    if (!j) return fallback;
    if (typeof j.detail === "string") return j.detail;
    if (typeof j.error === "string") return j.error;
    if (Array.isArray(j.detail)) {
      return j.detail.map((e) => e.msg || JSON.stringify(e)).join("; ");
    }
    return fallback;
  }

  async function refreshHealth() {
    try {
      const r = await fetch("/health");
      const j = await readJson(r);
      if (!r.ok) throw new Error(errText(j, r.statusText));
      if (typeof j.radio_fx === "boolean") fxRadio.checked = j.radio_fx;
      if (typeof j.flight_bg === "boolean") fxBg.checked = j.flight_bg;
      statusEl.innerHTML =
        `<span class="pill">${j.mock ? "MOCK" : "LIVE"}</span>` +
        `<span class="pill">${j.backend || ""}</span>` +
        `<span class="pill">${j.has_ark ? "ARK OK" : "NO ARK"}</span>` +
        `<span class="pill">${j.has_voice ? "VOICE OK" : "NO VOICE"}</span>` +
        `<span class="pill">FX ${j.radio_fx ? "ON" : "OFF"}</span>` +
        `<span class="pill">BG ${j.flight_bg ? "ON" : "OFF"}</span>`;
    } catch (e) {
      statusEl.textContent = "health failed: " + e;
    }
  }

  function flight() {
    return {
      callsign: cs.value.trim(),
      type: ty.value.trim(),
      registration: reg.value.trim(),
      route: route.value.trim(),
      altitude_m: Number(alt.value),
      speed_ms: Number(spd.value),
      track_deg: Number(trk.value),
      squawk: sq.value.trim(),
      icao24: hex.value.trim(),
    };
  }

  async function send(text) {
    const userText = (text || msg.value).trim();
    if (!userText) return;
    sendBtn.disabled = true;
    append("user", userText);
    const t0 = Date.now();
    const waitPill = setInterval(() => {
      const sec = Math.round((Date.now() - t0) / 1000);
      statusEl.innerHTML =
        (statusEl.dataset.base || statusEl.innerHTML) +
        ` <span class="pill">等待上游 ${sec}s…</span>`;
    }, 1000);
    statusEl.dataset.base = statusEl.innerHTML;
    const ac = new AbortController();
    const kill = setTimeout(() => ac.abort(), 180000);
    try {
      const r = await fetch("/v1/radio/turn", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        signal: ac.signal,
        body: JSON.stringify({
          flight: flight(),
          user_text: userText,
          history,
          want_audio: true,
          session_id: sessionId,
          radio_fx: fxRadio.checked,
          flight_bg: fxBg.checked,
          lang: langEl.value || "zh",
        }),
      });
      const j = await readJson(r);
      if (!r.ok) throw new Error(errText(j, r.statusText));
      sessionId = j.session_id;
      history.push({ role: "user", content: userText });
      history.push({ role: "assistant", content: j.reply_text });
      append("crew", j.reply_text);
      statusEl.innerHTML =
        (statusEl.dataset.base || "") +
        ` <span class="pill">${j.latency_ms} ms</span>` +
        ` <span class="pill">FX ${j.radio_fx ? "ON" : "OFF"}</span>` +
        ` <span class="pill">BG ${j.flight_bg ? "ON" : "OFF"}</span>`;
      const playUrl = j.audio_wav_url || j.audio_url;
      if (playUrl) {
        if (player._blobUrl) URL.revokeObjectURL(player._blobUrl);
        player.src = playUrl + (playUrl.includes("?") ? "&" : "?") + "t=" + Date.now();
        player._blobUrl = null;
        try {
          await player.play();
        } catch (_) {}
        statusEl.innerHTML +=
          ` <span class="pill">${j.sample_rate}Hz</span>` +
          ` <span class="pill">${playUrl}</span>`;
      }
    } catch (e) {
      const msg = (e && e.name === "AbortError")
        ? "等待超过 180 秒已取消，请再试一次"
        : String(e.message || e);
      append("crew", "[error] " + msg);
    } finally {
      clearInterval(waitPill);
      clearTimeout(kill);
      sendBtn.disabled = false;
    }
  }

  const sendBtn = document.getElementById("send");
  sendBtn.onclick = () => send();
  document.getElementById("clear").onclick = () => {
    sessionId = ""; history = []; logEl.textContent = "";
  };
  document.querySelectorAll("button[data-p]").forEach((b) => {
    b.onclick = () => { msg.value = b.dataset.p; send(b.dataset.p); };
  });
  refreshHealth();
</script>
</body>
</html>
