# =====================================================================
#  Board: M5Stack Tab5 (SKU C145 / K145)
#         ESP32-P4 + 16 MB flash + hex PSRAM
#         5" 1280×720 IPS via MIPI-DSI (native panel 720×1280 portrait)
#         Touch: GT911 (early units) / ST712x integrated (later units)
#         Wi-Fi / BT: ESP32-C6-MINI-1U over SDIO (esp-hosted)
#         Audio: ES8388 DAC + PA (SPK_EN on PI4IOE) — alarm LOCAL SPEAKER
#         microSD: native SDMMC (same pin family as Waveshare P4)
#
#  與 Waveshare P4-7B 相同的大架構(P4 + C6 hosted + mipi_dsi + sd_storage),
#  但腳位、IO 擴展器、codec、面板 model 全不同 —— 不要混用 7B 板檔。
#
#  橫向 UI:面板原生直向 720×1280,LVGL 軟體旋轉 270° → 邏輯解析度 1280×720。
#  (ST7121 用 270°;若畫面上下顛倒可改回 90°)
#  版面由 ui_800x480 以 ×1.5 生成(內容約 1200×720),右側約留 80px 底色;
#  16:9 與 5:3 長寬比不同,不能單倍率剛好鋪滿且保持雷達畫布為正方形。
#
#  顯示驅動因出廠批次而異(見 ESPHome mipi_dsi 說明):
#    · 2025-10-14 前:ILI9881C + GT911     → M5STACK-TAB5(預設)
#    · 之後:ST7123 或 ST7121 整合觸控     → M5STACK-TAB5-ST7123 / -ST7121
#  改入口檔 substitutions 的 tab5_display_model 即可。
#  本檔觸控預設 st7123(ST7121/ST7123);早期機改回 gt911。選錯 model 常黑屏。
#
#  引腳依據:M5Stack Tab5 官方管腳表 / 原理圖,以及
#  https://devices.esphome.io/devices/m5stack-tab5/
# =====================================================================

substitutions:
  # 可在 radar-tab5.yaml 覆寫。ST7123→M5STACK-TAB5-V2;ST7121→M5STACK-TAB5-ST7121
  tab5_display_model: "M5STACK-TAB5"

esphome:
  platformio_options:
    build_flags:
      - "-DSCREEN_W=${disp_w}"
      - "-DSCREEN_H=${disp_h}"
      - "-DRADAR_CANVAS=${radar_canvas}"
      - "-DRADAR_DISPLAY_RGB=3"    # MIPI-DSI → 截圖讀 DPI framebuffer
      - "-DSHOT_SWAP_BYTES=0"     # display + lvgl 皆 little_endian
      # 邏輯畫面是 90° 軟體旋轉;原生 FB 仍是直向掃描。截圖方向請實機再調,
      # 目前不做 ROT180(那是 7B 的 180° 補償)。
      - "-DRADAR_SHOT_ROT180=0"
      - "-DRADAR_LOCAL_SPK=1"
      - "-DRADAR_SD_EXT=1"

external_components:
  - source:
      type: local
      path: components
    # st7123: vendored from ESPHome dev (PR #12075); 2026.6.5 尚未内建
    components: [storage, sd_storage, st7123]

esp32:
  board: esp32-p4-evboard
  flash_size: 16MB
  cpu_frequency: 360MHz
  framework:
    type: esp-idf
    advanced:
      # Tab5 / P4 hosted Wi-Fi 需要實驗性 IDF 選項(官方 device 範例同樣開啟)
      enable_idf_experimental_features: true
      disable_fatfs: false
      include_builtin_idf_components: [fatfs]
    sdkconfig_options:
      CONFIG_FATFS_LFN_NONE: "n"
      CONFIG_FATFS_LFN_HEAP: "y"
      CONFIG_FATFS_MAX_LFN: "255"
      CONFIG_SPIRAM_USE_MALLOC: "y"
      CONFIG_SPIRAM_TRY_ALLOCATE_WIFI_LWIP: "y"
      CONFIG_MBEDTLS_DYNAMIC_BUFFER: "y"
      CONFIG_MBEDTLS_ASYMMETRIC_CONTENT_LEN: "y"

# USB 燒錄/日誌(Tab5 走 USB Serial/JTAG,不是 UART0)
logger:
  hardware_uart: USB_SERIAL_JTAG

psram:
  mode: hex
  speed: 200MHz

# ---- Wi-Fi: ESP32-C6 over SDIO (與 TF 卡的 SDMMC slot 分開) ----
# 管腳表:G12 CLK / G13 CMD / G11 D0 / G10 D1 / G9 D2 / G8 D3 / G15 RESET
esp32_hosted:
  variant: ESP32C6
  active_high: true
  reset_pin: GPIO15
  clk_pin: GPIO12
  cmd_pin: GPIO13
  d0_pin: GPIO11
  d1_pin: GPIO10
  d2_pin: GPIO9
  d3_pin: GPIO8
  slot: 1

# ---- microSD (SDIO1 / slot 0) — 與 Waveshare P4 同腳:39–42 / 43 / 44 ----
sd_storage:
  type: sd_mmc
  id: tf_card
  clk_pin: GPIO43
  cmd_pin: GPIO44
  data0_pin: GPIO39
  data1_pin: GPIO40
  data2_pin: GPIO41
  data3_pin: GPIO42
  slot: 0
  mount_path: /sdcard

# ---- 系統 I²C:觸控 / PI4IOE / ES8388 / INA226 / RTC 共用 ----
i2c:
  sda: GPIO31
  scl: GPIO32
  frequency: 400kHz

# DSI PHY 電源
esp_ldo:
  - channel: 3
    voltage: 2.5V

# ---- PI4IOE5V6408:只開雷達需要的腳,其餘電源/充電/相機不掛 HA 實體 ----
pi4ioe5v6408:
  - id: pi4ioe1
    address: 0x43
    # P1 SPK_EN / P4 LCD_RST / P5 TP_RST
  - id: pi4ioe2
    address: 0x44
    # P0 WLAN_PWR_EN — C6 供電,必須開著 Wi-Fi 才活

switch:
  - platform: gpio
    id: wifi_power
    name: "WiFi Power"
    pin:
      pi4ioe5v6408: pi4ioe2
      number: 0
    restore_mode: ALWAYS_ON
  - platform: gpio
    id: spk_pa
    pin:
      pi4ioe5v6408: pi4ioe1
      number: 1
    restore_mode: ALWAYS_OFF
    internal: true
  # ST7121 顯示/觸控同 die:勿在 touchscreen.reset_pin 再脈衝復位(會沖掉已初始化狀態)。
  # 只保持 TP_RST 釋放(高電平);LCD 復位仍由 display.reset_pin 負責。
  - platform: gpio
    id: tp_nreset
    pin:
      pi4ioe5v6408: pi4ioe1
      number: 5
    restore_mode: ALWAYS_ON
    internal: true

# ---- 背光 GPIO22(高電位亮,可 PWM)----
output:
  - platform: ledc
    pin: GPIO22
    id: bl_pwm
    frequency: 1000Hz

light:
  - platform: monochromatic
    id: backlight
    output: bl_pwm
    name: Backlight
    restore_mode: RESTORE_DEFAULT_ON

# ---- 板載喇叭(鬧鐘 LOCAL SPEAKER):ES8388 + NS4150B ----
i2s_audio:
  - id: i2s_out
    i2s_mclk_pin: GPIO30
    i2s_bclk_pin: GPIO27
    i2s_lrclk_pin: GPIO29

audio_dac:
  - platform: es8388
    id: es8388_dac

speaker:
  - platform: i2s_audio
    id: local_spk
    i2s_audio_id: i2s_out
    dac_type: external
    i2s_dout_pin: GPIO26
    audio_dac: es8388_dac
    sample_rate: 16000
    bits_per_sample: 16bit
    channel: mono

rtttl:
  id: alarm_tone
  speaker: local_spk
  gain: 0.6
  on_finished_playback:
    - switch.turn_off: spk_pa

script:
  - id: local_ring_start
    mode: single
    then:
      - switch.turn_on: spk_pa
      - rtttl.play: "radar:d=8,o=6,b=180:c,p,c,p,c,4p,c,p,c,p,c,4p,c,p,c,p,c,4p,c,p,c,p,c,4p,c,p,c,p,c,4p,c,p,c,p,c,4p,c,p,c,p,c,4p,c,p,c,p,c"
  - id: local_ring_stop
    mode: single
    then:
      - rtttl.stop:
      - switch.turn_off: spk_pa

# ---- 顯示:原生直向,橫向由下方 lvgl.rotation 處理(須在 touchscreen 之前) ----
display:
  - platform: mipi_dsi
    id: main_display
    model: ${tab5_display_model}
    reset_pin:
      pi4ioe5v6408: pi4ioe1
      number: 4
    update_interval: never
    auto_clear_enabled: false

# LVGL 9:rotation / byte_order 寫在 lvgl(不可寫在 display)
# Tab5 ST7121 橫向用 270°(90° 會上下顛倒)
lvgl:
  rotation: 270°
  byte_order: little_endian

# ---- 觸控:ST7121/ST7123 用 st7123(I²C 0x55);早期 GT911 請改回 platform: gt911 ----
# ST7121:勿設 reset_pin(見上方 tp_nreset)。
#
# LVGL 9 在 lvgl.rotation=270° 時會對觸控再做一次 rotate_coordinates
# (lvgl_esphome.cpp)。觸控必須輸出「面板原生 / display FB」座標
# (720×1280),不要在這裡做橫向 swap——否則會雙重變換→漂移或點不到。
# 也不要掛 interrupt_pin:一掛上 ESPHome 會停掉輪詢,Tab5 上 INT 常不穩。
touchscreen:
  - platform: st7123
    id: my_touch
    display: main_display
    update_interval: 50ms
    calibration:
      x_min: 0
      x_max: 720
      y_min: 0
      y_max: 1280
    on_touch:
      - lambda: |-
          if (!id(backlight).current_values.is_on()) {
            id(wake_ms) = millis();
            auto call = id(backlight).turn_on();
            call.perform();
            lv_obj_add_state((lv_obj_t *) id(pwr_btn), LV_STATE_CHECKED);
            lv_obj_set_style_text_color(id(pwr_btn_l), lv_color_hex(0x04180C), 0);
          }
    on_update:
      - lambda: |-
          int n = (int) touches.size();
          if (n >= 3) {
            float my = 0;
            for (auto &tp : touches) my += tp.y;
            my /= n;
            if (!id(shot_armed)) {
              id(shot_armed) = true;
              id(shot_y0) = my;
              id(shot_ms) = millis();
            } else if (my - id(shot_y0) > 70.0f && millis() - id(shot_ms) < 1500) {
              id(shot_armed) = false;
              id(take_screenshot).execute();
            }
          } else {
            id(shot_armed) = false;
          }
    on_release:
      - lambda: 'id(shot_armed) = false;'
