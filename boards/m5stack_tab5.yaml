# =====================================================================
#  Board: M5Stack Tab5 (SKU C145 / K145)
#         ESP32-P4 + 16 MB flash + hex PSRAM
#         5" 1280×720 IPS via MIPI-DSI (native panel 720×1280 portrait)
#         Touch: GT911 (early units) / ST712x integrated (later units)
#         Wi-Fi / BT: ESP32-C6-MINI-1U over SDIO (esp-hosted)
#         Audio: ES8388 DAC + PA (SPK_EN on PI4IOE) — alarm LOCAL SPEAKER
#         microSD: native SDMMC (same pin family as Waveshare P4)
#
#  與 Waveshare P4-7B 相同的大架構(P4 + C6 hosted + mipi_dsi + sd_storage),
#  但腳位、IO 擴展器、codec、面板 model 全不同 —— 不要混用 7B 板檔。
#
#  橫向 UI:面板原生直向 720×1280,LVGL 軟體旋轉 270° → 邏輯解析度 1280×720。
#  (ST7121 用 270°;若畫面上下顛倒可改回 90°)
#  版面由 ui_800x480 以 ×1.5 生成(內容約 1200×720),右側約留 80px 底色;
#  16:9 與 5:3 長寬比不同,不能單倍率剛好鋪滿且保持雷達畫布為正方形。
#
#  顯示驅動因出廠批次而異(見 ESPHome mipi_dsi 說明):
#    · 2025-10-14 前:ILI9881C + GT911     → M5STACK-TAB5(預設)
#    · 之後:ST7123 或 ST7121 整合觸控     → M5STACK-TAB5-ST7123 / -ST7121
#  改入口檔 substitutions 的 tab5_display_model 即可。
#  本檔觸控預設 st7123(ST7121/ST7123);早期機改回 gt911。選錯 model 常黑屏。
#
#  引腳依據:M5Stack Tab5 官方管腳表 / 原理圖,以及
#  https://devices.esphome.io/devices/m5stack-tab5/
# =====================================================================

substitutions:
  # 可在 radar-tab5.yaml 覆寫。ST7123→M5STACK-TAB5-V2;ST7121→M5STACK-TAB5-ST7121
  tab5_display_model: "M5STACK-TAB5"

esphome:
  includes:
    - tab5_kb.h
    - tab5_audio.h
  on_boot:
    # M5Unified Tab5:完整写 ES8388 后再开功放。ESPHome es8388::setup() 不够。
    # devices.esphome.io:板载喇叭需 DAC→LINE1/BOTH;SPK_EN 建议常开。
    # 注意:本板 on_boot 可能与 core 合并/覆盖;下拉箭头清除务必在此再跑一次。
    - priority: -100
      then:
        - lambda: |-
            id(es8388_dac).set_mute_off();
            // M5 序列最后写:含 DACPOWER=0x3C / mixer / OUT vol(勿再被 set_dac_output 覆盖)
            tab5_audio::es8388_speaker_on(id(i2c_sys));
            ESP_LOGI("radar_bg", "es8388 DAC enabled (M5Unified seq)");
        - switch.turn_on: spk_pa
        - script.execute: hide_dd_symbols
  platformio_options:
    build_flags:
      - "-DSCREEN_W=${disp_w}"
      - "-DSCREEN_H=${disp_h}"
      - "-DRADAR_CANVAS=${radar_canvas}"
      - "-DRADAR_DISPLAY_RGB=3"    # MIPI-DSI → 截圖讀 DPI framebuffer
      - "-DSHOT_SWAP_BYTES=0"     # display + lvgl 皆 little_endian
      # 邏輯畫面是 90° 軟體旋轉;原生 FB 仍是直向掃描。截圖方向請實機再調,
      # 目前不做 ROT180(那是 7B 的 180° 補償)。
      - "-DRADAR_SHOT_ROT180=0"
      - "-DRADAR_LOCAL_SPK=1"
      - "-DRADAR_SD_EXT=1"
      - "-DTAB5_KB=1"           # Tab5 Keyboard(A164) Ext.Port1
      - "-DTAB5_MIC=1"          # ES7210 双麦点按录音
      - "-DTAB5_BAT=1"          # INA226 电量 + IP2326 充电状态
      - "-DRADAR_NO_ALARM=1"    # 暂关闹钟:省 RAM/CPU,优先稳住喇叭播放

external_components:
  - source:
      type: local
      path: components
    # st7123: vendored from ESPHome dev (PR #12075); 2026.6.5 尚未内建
    # tab5_i2s_fix: 编译期软补丁 stock i2s_audio(勿整包 vendor i2s_audio→DRAM 耗尽黑屏)
    components: [storage, sd_storage, st7123, tab5_i2s_fix]

esp32:
  board: esp32-p4-evboard
  flash_size: 16MB
  cpu_frequency: 360MHz
  framework:
    type: esp-idf
    advanced:
      # Tab5 / P4 hosted Wi-Fi 需要實驗性 IDF 選項(官方 device 範例同樣開啟)
      enable_idf_experimental_features: true
      disable_fatfs: false
      include_builtin_idf_components: [fatfs]
    sdkconfig_options:
      CONFIG_FATFS_LFN_NONE: "n"
      CONFIG_FATFS_LFN_HEAP: "y"
      CONFIG_FATFS_MAX_LFN: "255"
      CONFIG_SPIRAM_USE_MALLOC: "y"
      CONFIG_SPIRAM_TRY_ALLOCATE_WIFI_LWIP: "y"
      # 预留更多内部 DRAM 给 FreeRTOS Timer/DMA(避免 vApplicationGetTimerTaskMemory 断言黑屏)
      CONFIG_SPIRAM_MALLOC_RESERVE_INTERNAL: "65536"
      # I2S ISR 进 IRAM 会挤占 P4 内部 SRAM;Tab5+LVGL 上改为关闭
      CONFIG_I2S_ISR_IRAM_SAFE: "n"
      CONFIG_MBEDTLS_DYNAMIC_BUFFER: "y"
      CONFIG_MBEDTLS_ASYMMETRIC_CONTENT_LEN: "y"

# USB 燒錄/日誌(Tab5 走 USB Serial/JTAG,不是 UART0)
logger:
  hardware_uart: USB_SERIAL_JTAG

psram:
  mode: hex
  speed: 200MHz

# ---- Wi-Fi: ESP32-C6 over SDIO (與 TF 卡的 SDMMC slot 分開) ----
# 管腳表:G12 CLK / G13 CMD / G11 D0 / G10 D1 / G9 D2 / G8 D3 / G15 RESET
esp32_hosted:
  variant: ESP32C6
  active_high: true
  reset_pin: GPIO15
  clk_pin: GPIO12
  cmd_pin: GPIO13
  d0_pin: GPIO11
  d1_pin: GPIO10
  d2_pin: GPIO9
  d3_pin: GPIO8
  slot: 1

# ---- microSD (SDIO1 / slot 0) — 與 Waveshare P4 同腳:39–42 / 43 / 44 ----
sd_storage:
  type: sd_mmc
  id: tf_card
  clk_pin: GPIO43
  cmd_pin: GPIO44
  data0_pin: GPIO39
  data1_pin: GPIO40
  data2_pin: GPIO41
  data3_pin: GPIO42
  slot: 0
  mount_path: /sdcard

# ---- 系统 I²C:触控 / PI4IOE / ES8388 / INA226 / RTC 共用 ----
# Ext.Port1 另开一路给 Tab5 Keyboard(A164):SDA=G0 SCL=G1 INT=G50
i2c:
  - id: i2c_sys
    sda: GPIO31
    scl: GPIO32
    frequency: 400kHz
  - id: i2c_kb
    sda: GPIO0
    scl: GPIO1
    frequency: 100kHz

# DSI PHY 电源
esp_ldo:
  - channel: 3
    voltage: 2.5V

# ---- PI4IOE5V6408:只开雷達需要的腳 ----
# pi4ioe1@0x43: P1 SPK_EN / P4 LCD_RST / P5 TP_RST
# pi4ioe2@0x44: P0 WLAN_PWR_EN / P6 CHG_STAT(入) / P7 CHG_EN
pi4ioe5v6408:
  - id: pi4ioe1
    i2c_id: i2c_sys
    address: 0x43
  - id: pi4ioe2
    i2c_id: i2c_sys
    address: 0x44

switch:
  - platform: gpio
    id: wifi_power
    name: "WiFi Power"
    pin:
      pi4ioe5v6408: pi4ioe2
      number: 0
    restore_mode: ALWAYS_ON
  - platform: gpio
    id: spk_pa
    pin:
      pi4ioe5v6408: pi4ioe1
      number: 1
    # 官方 Tab5 ESPHome:speaker_enable ALWAYS_ON;高电平开 NS4150
    restore_mode: ALWAYS_ON
    internal: true
  # 开机后须使能充电(IP2326);关机态无法充
  - platform: gpio
    id: charge_enable
    pin:
      pi4ioe5v6408: pi4ioe2
      number: 7
    restore_mode: ALWAYS_ON
    internal: true
  # ST7121 顯示/觸控同 die:勿在 touchscreen.reset_pin 再脈衝復位(會沖掉已初始化狀態)。
  # 只保持 TP_RST 釋放(高電平);LCD 復位仍由 display.reset_pin 負責。
  - platform: gpio
    id: tp_nreset
    pin:
      pi4ioe5v6408: pi4ioe1
      number: 5
    restore_mode: ALWAYS_ON
    internal: true

# IP2326 CHG_STAT(高=充电中);也可结合 INA226 电流极性辅助判断
binary_sensor:
  - platform: gpio
    id: bat_charging
    pin:
      pi4ioe5v6408: pi4ioe2
      number: 6
      mode: INPUT_PULLDOWN
    internal: true

# INA226:2S 电池总线电压/电流(官方 devices.esphome.io Tab5)
sensor:
  - platform: ina226
    i2c_id: i2c_sys
    address: 0x41
    adc_averaging: 16
    max_current: 8.192A
    shunt_resistance: 0.005ohm
    update_interval: 15s
    bus_voltage:
      id: battery_voltage
      internal: true
      accuracy_decimals: 2
    current:
      id: battery_current
      internal: true
      accuracy_decimals: 3
      # 正=放电,负=充电(官方注释)
  - platform: template
    id: battery_percent
    internal: true
    unit_of_measurement: "%"
    accuracy_decimals: 0
    update_interval: 15s
    lambda: |-
      float v = id(battery_voltage).state;
      if (isnan(v) || v < 1.0f) return NAN;
      // NP-F550 2S:满电约 8.23V,关机阈值约 6.0V(产品规格)
      const float vmin = 6.0f, vmax = 8.23f;
      float pct = (v - vmin) / (vmax - vmin) * 100.0f;
      if (pct > 100.0f) pct = 100.0f;
      if (pct < 0.0f) pct = 0.0f;
      return pct;

# ---- 背光 GPIO22(高電位亮,可 PWM)----
output:
  - platform: ledc
    pin: GPIO22
    id: bl_pwm
    frequency: 1000Hz

light:
  - platform: monochromatic
    id: backlight
    output: bl_pwm
    name: Backlight
    restore_mode: RESTORE_DEFAULT_ON

# ---- 板載喇叭:ES8388 + NS4150B(对齐 devices.esphome.io/M5Stack-Tab5 + M5Unified)----
# HPOUT_L → NS4150;I2S:MCLK30 BCLK27 LRCK29 DOUT26;codec I2C 0x10
tab5_i2s_fix:

i2s_audio:
  - id: i2s_out
    i2s_mclk_pin: GPIO30
    i2s_bclk_pin: GPIO27
    i2s_lrclk_pin: GPIO29

audio_dac:
  - platform: es8388
    id: es8388_dac
    i2c_id: i2c_sys

# ES7210 双麦(与 ES8388 共用 MCLK/BCLK/LRCK;DIN=GPIO28)
audio_adc:
  - platform: es7210
    id: es7210_adc
    i2c_id: i2c_sys
    bits_per_sample: 16bit
    sample_rate: 16000
    mic_gain: 24db

speaker:
  - platform: i2s_audio
    id: local_spk
    i2s_audio_id: i2s_out
    dac_type: external
    i2s_dout_pin: GPIO26
    audio_dac: es8388_dac
    # 与 voice_atc / RTTTL beep 同为 16k;连续喂入,减少分段 finish 卡顿
    sample_rate: 16000
    bits_per_sample: 16bit
    channel: mono
    # ES8388 single-speed 合法比:256(见 datasheet Table1);codec reg24=0x02
    mclk_multiple: 256
    use_apll: false
    buffer_duration: 800ms
    timeout: 1500ms

microphone:
  - platform: i2s_audio
    id: tab5_mic
    i2s_audio_id: i2s_out
    adc_type: external
    i2s_din_pin: GPIO28
    sample_rate: 16000
    bits_per_sample: 16bit
    channel: left
    pdm: false
    # 半双工:录音时由脚本停播;不与 speaker 同时跑
    on_data:
      - lambda: |-
          if (id(talk_rec_on))
            radar_bg::asr_buf_append(x);

rtttl:
  id: alarm_tone
  speaker: local_spk
  gain: 0.6

script:
  - id: tab5_codec_ready
    mode: single
    then:
      - lambda: |-
          id(es8388_dac).set_mute_off();
          tab5_audio::es8388_speaker_on(id(i2c_sys));
      - switch.turn_on: spk_pa
  # 闹钟已用 RADAR_NO_ALARM 关闭;保留 stub 供 core.yaml 调用
  - id: local_ring_start
    mode: single
    then:
      - lambda: 'ESP_LOGD("radar_bg", "alarm ring skipped (RADAR_NO_ALARM)");'
  - id: local_ring_stop
    mode: single
    then: []
  # 无 common/alarm.yaml:core 里 #ifndef 仍可能引用这些 id,必须提供空 stub
  - id: start_alarm
    mode: single
    then: []
  - id: stop_alarm
    mode: single
    then: []
  - id: snooze_alarm
    mode: single
    then: []
  - id: fire_alarm
    mode: single
    then: []
  - id: hush_alarm
    mode: single
    then: []
  - id: alarm_refresh
    mode: single
    then: []
  - id: spk_dd_refresh
    mode: single
    then: []
  - id: spk_scan
    mode: single
    then: []
  - id: tp_open
    mode: single
    then: []
  - id: voice_vol_beep
    mode: restart
    then:
      - if:
          condition:
            lambda: 'return radar_bg::g_voice_playing;'
          then:
            - lambda: 'ESP_LOGD("radar_bg", "vol beep skipped (voice playing)");'
          else:
            - script.execute: tab5_codec_ready
            - lambda: |-
                float vol = id(voice_vol).state / 100.0f;
                if (vol < 0.05f) vol = 0.05f;
                id(local_spk).set_volume(vol);
                ESP_LOGI("radar_bg", "vol beep %.0f%%", id(voice_vol).state);
            - rtttl.play: "beep:d=16,o=5,b=200:e6,g6"
  - id: voice_spk_stop
    mode: single
    then:
      - lambda: |-
          radar_bg::g_voice_playing = false;
          radar_bg::g_voice_pcm_ready = false;
          radar_bg::g_voice_pcm.clear();
          radar_bg::g_voice_pcm_pos = 0;
      # stop 立即释放 I2S(finish 会等缓冲播完,麦起不来)
      - speaker.stop:
          id: local_spk

# ---- 顯示:原生直向,橫向由下方 lvgl.rotation 處理(須在 touchscreen 之前) ----
display:
  - platform: mipi_dsi
    id: main_display
    model: ${tab5_display_model}
    reset_pin:
      pi4ioe5v6408: pi4ioe1
      number: 4
    update_interval: never
    auto_clear_enabled: false

# LVGL 9:rotation / byte_order 寫在 lvgl(不可寫在 display)
# Tab5 ST7121 橫向用 270°(90° 會上下顛倒)
#
# 勿設 buffer_size:12% —— 小緩衝 + 270° 軟體旋轉會把每幀拆成大量 partial
# flush,每次都要 PPA/軟轉,實機 LVGL 120→400ms+ 後 loopTask WDT 重啟環。
# 與 P4-7B 一樣用預設全屏緩衝(PSRAM);大螢幕吃帶寬但不會卡死看門狗。
lvgl:
  rotation: 270°
  byte_order: little_endian

# ---- 觸控:ST7121/ST7123 用 st7123(I²C 0x55);早期 GT911 請改回 platform: gt911 ----
# ST7121:勿設 reset_pin(見上方 tp_nreset)。
#
# LVGL 9 在 lvgl.rotation=270° 時會對觸控再做一次 rotate_coordinates
# (lvgl_esphome.cpp)。觸控必須輸出「面板原生 / display FB」座標
# (720×1280),不要在這裡做橫向 swap——否則會雙重變換→漂移或點不到。
# 也不要掛 interrupt_pin:一掛上 ESPHome 會停掉輪詢,Tab5 上 INT 常不穩。
touchscreen:
  - platform: st7123
    id: my_touch
    i2c_id: i2c_sys
    display: main_display
    update_interval: 66ms
    calibration:
      x_min: 0
      x_max: 720
      y_min: 0
      y_max: 1280
    on_touch:
      - lambda: |-
          if (!id(backlight).current_values.is_on()) {
            id(wake_ms) = millis();
            auto call = id(backlight).turn_on();
            call.perform();
            lv_obj_add_state((lv_obj_t *) id(pwr_btn), LV_STATE_CHECKED);
            lv_obj_set_style_text_color(id(pwr_btn_l), lv_color_hex(0x04180C), 0);
          }
    on_update:
      - lambda: |-
          int n = (int) touches.size();
          if (n >= 3) {
            float my = 0;
            for (auto &tp : touches) my += tp.y;
            my /= n;
            if (!id(shot_armed)) {
              id(shot_armed) = true;
              id(shot_y0) = my;
              id(shot_ms) = millis();
            } else if (my - id(shot_y0) > 70.0f && millis() - id(shot_ms) < 1500) {
              id(shot_armed) = false;
              id(take_screenshot).execute();
            }
          } else {
            id(shot_armed) = false;
          }
    on_release:
      - lambda: 'id(shot_armed) = false;'

# Tab5 Keyboard (A164) — 与 Voice PCM 泵拆开,避免 40ms 同拍争用
interval:
  - interval: 40ms
    then:
      - lambda: |-
          static uint8_t kb_phase = 0;
          if (kb_phase == 0) {
            tab5_kb::setup(id(i2c_kb));
            kb_phase = 1;
          } else if (kb_phase == 1 || kb_phase == 2) {
            // 重试直到软键盘对象就绪
            if (id(call_kb)->obj != nullptr && id(cfg_kb)->obj != nullptr) {
              tab5_kb::bind_soft_kbs(id(call_kb)->obj, id(cfg_kb)->obj);
              kb_phase = 3;
            } else {
              kb_phase = 2;
            }
          }
          tab5_kb::poll();
          if (radar_kb_want_talk() && id(call_on) && !id(call_talk_on))
            id(open_call_talk).execute();

  # Voice ATC PCM → 板载喇叭(16k 原生连续喂入);独立 10ms 泵减少欠载
  - interval: 10ms
    then:
      - lambda: |-
          // 空闲早退:避免无播放时也每 10ms 占 loop
          // 录音中禁止喂喇叭,避免与 ES7210 抢同一 I2S
          if (id(talk_rec_on))
            return;
          if (!radar_bg::g_voice_playing && !radar_bg::g_voice_pcm_ready)
            return;

          static float voice_vol_applied = -1.0f;
          static bool voice_dac_ok = false;

          if (!voice_dac_ok) {
            id(es8388_dac).set_mute_off();
            tab5_audio::es8388_speaker_on(id(i2c_sys));
            id(spk_pa).turn_on();
            voice_dac_ok = true;
          }

          if (radar_bg::g_voice_pcm_ready) {
            xSemaphoreTake(radar_bg::mtx(), portMAX_DELAY);
            radar_bg::g_voice_pcm_ready = false;
            bool has = !radar_bg::g_voice_pcm.empty();
            radar_bg::g_voice_pcm_pos = 0;
            xSemaphoreGive(radar_bg::mtx());
            if (has) {
              id(local_ring_stop).execute();
              id(spk_pa).turn_on();
              float vol = id(voice_vol).state / 100.0f;
              if (vol < 0.05f) vol = 0.05f;
              id(local_spk).set_volume(vol);
              voice_vol_applied = vol;
              radar_bg::g_voice_playing = true;
              ESP_LOGI("radar_bg", "voice play %u bytes vol=%.0f%% @16k",
                       (unsigned) radar_bg::g_voice_pcm.size(),
                       id(voice_vol).state);
            }
          }
          if (radar_bg::g_voice_playing) {
            float vol = id(voice_vol).state / 100.0f;
            if (vol < 0.05f) vol = 0.05f;
            if (vol != voice_vol_applied) {
              id(local_spk).set_volume(vol);
              voice_vol_applied = vol;
            }
            auto &pcm = radar_bg::g_voice_pcm;
            size_t &pos = radar_bg::g_voice_pcm_pos;
            // 连续灌环缓;非阻塞写满可用空间,减少欠载卡顿
            const size_t k_chunk = 8192;   // 256ms @16k mono s16
            if (pos >= pcm.size()) {
              if (!id(local_spk).has_buffered_data()) {
                id(local_spk).finish();
                if (id(local_spk).is_stopped()) {
                  radar_bg::g_voice_playing = false;
                  pcm.clear();
                  pcm.shrink_to_fit();
                }
              }
            } else {
              size_t room = pcm.size() - pos;
              size_t want = room < k_chunk ? room : k_chunk;
              want &= ~1u;
              if (want >= 2) {
                size_t n = id(local_spk).play(pcm.data() + pos, want, 0);
                pos += n;
              }
            }
          }

  # 右上角电量/充电状态(bat_label 仅 Tab5 UI)
  - interval: 5s
    then:
      - lambda: |-
          float pct = id(battery_percent).state;
          float v = id(battery_voltage).state;
          float cur = id(battery_current).state;
          bool chg = id(bat_charging).state;
          // 电流为负也视为充电中(USB 供电时 STAT 偶发不准)
          if (!isnan(cur) && cur < -0.05f) chg = true;
          char buf[24];
          uint32_t color = 0x6E8273;
          if (isnan(pct)) {
            snprintf(buf, sizeof(buf), "BAT --");
          } else {
            int p = (int) (pct + 0.5f);
            if (p < 0) p = 0;
            if (p > 100) p = 100;
            if (chg) {
              snprintf(buf, sizeof(buf), "CHG %d%%", p);
              color = 0x00E66E;
            } else {
              snprintf(buf, sizeof(buf), "BAT %d%%", p);
              if (p <= 15) color = 0xE04040;
              else if (p <= 30) color = 0xE8A020;
            }
          }
          lv_label_set_text(id(bat_label), buf);
          lv_obj_set_style_text_color(id(bat_label), lv_color_hex(color), 0);
          if (!isnan(v))
            ESP_LOGD("radar_bg", "bat %.2fV %.0f%% cur=%.3fA chg=%d",
                     v, isnan(pct) ? -1.0f : pct, isnan(cur) ? 0.0f : cur, (int) chg);

