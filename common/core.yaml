button:
  - platform: restart
    name: Restart

interval:
  # 抓取節拍器:每秒 +1,到達 Poll Interval 且條件允許就抓一次
  - interval: 1s
    then:
      - lambda: |-
          // i 鈕開啟中 → 每秒刷新系統資訊(RAM/PSRAM/運行時間會變)
          if (id(info_on)) id(show_sysinfo).execute();
          // 工具列每秒置頂一次:航班 mark 顯隱/set_pos 後偶發搶上層,SYS 就點不到
          // 通話面板開啟時改置頂通話層,避免蓋住 CHECK/TALK
          if (id(call_on)) {
            if (id(call_talk_on)) {
              lv_obj_move_foreground((lv_obj_t *) id(call_talk_panel));
              #ifndef TAB5_KB
              if (!lv_obj_has_flag(id(call_kb)->obj, LV_OBJ_FLAG_HIDDEN))
                lv_obj_move_foreground(id(call_kb)->obj);
              #endif
            } else {
              lv_obj_move_foreground((lv_obj_t *) id(call_panel));
            }
          } else {
            lv_obj_t *tb[] = {
              (lv_obj_t *) id(map_btn), (lv_obj_t *) id(echo_btn),
              (lv_obj_t *) id(persist_btn), (lv_obj_t *) id(atc_btn),
              (lv_obj_t *) id(pwr_btn), (lv_obj_t *) id(info_btn),
            };
            for (auto *b : tb) {
              if (b) lv_obj_move_foreground(b);
            }
          }
          // 響鈴中 → 每 15 秒重播一次,直到使用者按 DISMISS
          #ifndef RADAR_NO_ALARM
          if (id(alarm_ringing) && (millis() - id(ring_last_ms)) >= 15000) {
            id(ring_last_ms) = millis();
            id(fire_alarm).execute();
          }
          // 貪睡到期 → 重新響
          if (id(snooze_at) > 0 && !id(alarm_ringing)) {
            auto t = id(rtc_time).now();
            if (t.is_valid() && (uint32_t) t.timestamp >= id(snooze_at)) {
              id(snooze_at) = 0;
              id(start_alarm).execute();
            }
          }
          #endif
          id(poll_tick) += 1;
          bool creds = !id(opensky_client_id).state.empty() &&
                       !id(opensky_client_secret).state.empty();
          if (id(data_src) == 0 && !creds) {   // 免費來源不需憑證,擋門只對 OpenSky
            lv_label_set_text(id(status_label), "SET OPENSKY CREDENTIALS");
            return;
          }
          // OpenSky 失敗冷卻中(bg task 走免費來源)→ 節奏也切到免費來源的間隔
          // MERGE 另夾到 >=45s;NVS 仍存使用者 POLL 原值
          bool cooling = (millis() / 1000) < radar_bg::g_os_cooldown_until;
          int itv = radar_bg::effective_poll_s(id(data_src),
                                              (int) id(poll_interval).state,
                                              (int) id(poll_interval_alt).state,
                                              cooling);
          if (id(poll_tick) >= itv) {
            if (wifi::global_wifi_component->is_connected() &&
                (id(backlight).current_values.is_on() || id(poll_when_off))) {   // 背光關=暫停抓取(可設定例外)
              id(poll_tick) = 0;
              id(fetch_flights).execute();
            }
          }
      # 收背景 task 的結果(非阻塞)
      - lambda: |-
          if (radar_bg::g_asr_ready) {
            xSemaphoreTake(radar_bg::mtx(), portMAX_DELAY);
            radar_bg::g_asr_ready = false;
            std::string text = radar_bg::g_asr_text;
            int st = radar_bg::g_asr_status;
            xSemaphoreGive(radar_bg::mtx());
            ESP_LOGI("radar_bg", "asr UI apply st=%d talk=%d call=%d len=%u", st,
                     (int) id(call_talk_on), (int) id(call_on),
                     (unsigned) text.size());
            if (id(call_on) && !text.empty()) {
              // 勿调 open_call_talk:它会清空 ta_call(异步竞态)
              if (!id(call_talk_on)) {
                id(call_talk_on) = true;
                lv_obj_add_flag((lv_obj_t *) id(call_panel), LV_OBJ_FLAG_HIDDEN);
                lv_obj_clear_flag((lv_obj_t *) id(call_talk_panel), LV_OBJ_FLAG_HIDDEN);
                lv_obj_move_foreground((lv_obj_t *) id(call_talk_panel));
              }
              lv_textarea_set_text((lv_obj_t *) id(ta_call), text.c_str());
              char buf[200];
              snprintf(buf, sizeof(buf), "TX: %s\nRX: edit then SEND", text.c_str());
              lv_label_set_text(id(call_log_l), buf);
            } else if (id(call_on)) {
              char buf[48];
              snprintf(buf, sizeof(buf), "ASR fail HTTP %d", st);
              lv_textarea_set_text((lv_obj_t *) id(ta_call), buf);
              char log[96];
              snprintf(log, sizeof(log), "TX: ASR fail HTTP %d\nRX: --", st);
              lv_label_set_text(id(call_log_l), log);
            }
          }
          // 录音超时 8s 自动停
          if (id(talk_rec_on) && millis() - id(talk_rec_ms) > 8000) {
            id(talk_rec_toggle).execute();
          }
          if (radar_bg::g_voice_ready) {
            xSemaphoreTake(radar_bg::mtx(), portMAX_DELAY);
            radar_bg::g_voice_ready = false;
            std::string reply = radar_bg::g_voice_reply;
            std::string user_tx = radar_bg::g_voice_user_text;
            radar_bg::g_voice_user_text.clear();
            xSemaphoreGive(radar_bg::mtx());
            if (id(call_on)) {
              // 语音直发回来时确保在 CALL 面板
              if (id(call_talk_on)) {
                id(call_talk_on) = false;
                lv_obj_add_flag((lv_obj_t *) id(call_talk_panel), LV_OBJ_FLAG_HIDDEN);
                lv_obj_add_flag(id(call_kb)->obj, LV_OBJ_FLAG_HIDDEN);
                lv_obj_clear_flag((lv_obj_t *) id(call_panel), LV_OBJ_FLAG_HIDDEN);
                lv_obj_move_foreground((lv_obj_t *) id(call_panel));
              }
              char buf[384];
              if (!user_tx.empty()) {
                snprintf(buf, sizeof(buf), "TX: %s\nRX: %s", user_tx.c_str(), reply.c_str());
                id(voice_hist_role).push_back("user");
                id(voice_hist_text).push_back(user_tx);
              } else {
                snprintf(buf, sizeof(buf), "RX: %s", reply.c_str());
              }
              lv_label_set_text(id(call_log_l), buf);
              id(voice_hist_role).push_back("assistant");
              id(voice_hist_text).push_back(reply);
              while (id(voice_hist_role).size() > 12) {
                id(voice_hist_role).erase(id(voice_hist_role).begin());
                id(voice_hist_text).erase(id(voice_hist_text).begin());
              }
            }
          }
          if (radar_bg::g_auth_fail) {
            radar_bg::g_auth_fail = false;
            lv_label_set_text(id(status_label), "OPENSKY AUTH FAIL - USING FALLBACK");
          }
          static bool echo_init = false;
          if (!echo_init && id(echo_on) && millis() > 8000 &&
              wifi::global_wifi_component->is_connected()) {
            echo_init = true;
            id(echo_refresh).execute();
          }
          if (radar_bg::g_echo_ready) {
            xSemaphoreTake(radar_bg::mtx(), portMAX_DELAY);
            radar_bg::g_echo_ready = false;
            xSemaphoreGive(radar_bg::mtx());
            if (id(echo_on))
              id(rebuild_base).execute();   // 新幀預混合進底圖,一次算完
          }
          // ---- 地圖圖磚:需要時下載一次,完成後由主迴圈載入 ----
          // 觸發條件刻意保守,避免變成重試迴圈把流量燒掉(見 PLAN_MAPTILES.md):
          // 連上網之後,只有「目前沒有地圖」或「座標/半徑已經離存起來的那份太遠」
          // 才抓。maps_key 記下上次請求的參數,同一組不重複請求。
          if (millis() > 10000 && wifi::global_wifi_component->is_connected() &&
              !radar_bg::g_maps_busy) {
            const int lv = radar_bg::maps_level_for(id(radar_range).state);
            // 0.5 度約 55 km:小幅移動不必重抓,格子是 10 度寬,綽綽有餘。
            char key[48];
            snprintf(key, sizeof(key), "%.1f,%.1f,L%d",
                     id(home_lat).state, id(home_lon).state, lv);
            // maps_key 只在「成功之後」才記起來。實機上第一次開機還在 captive
            // portal(is_connected() 在 AP 模式也成立),抓一定失敗;先前是送出
            // 請求就把 key 寫掉,於是連上網之後再也不會重試,地圖永遠是空的。
            // 失敗只更新 maps_try_ms,5 分鐘後再試一次 —— 有節流但不會放棄。
            if (id(maps_key) != key &&
                (id(maps_try_ms) == 0 || millis() - id(maps_try_ms) > 300000)) {
              id(maps_try_ms) = millis();
              id(maps_key_try) = key;
              radar_bg::request_maps(id(home_lat).state, id(home_lon).state,
                                     id(radar_range).state);
            }
          }
          // 下載中在 INITIALIZING 下面那行顯示進度。分母是格數不是位元組(見
          // radar_fetch.h 的說明);沒選航班時才寫,否則會蓋掉航線顯示。
          {
            static bool was_busy = false;
            const bool busy = radar_bg::g_maps_busy;
            if (busy && id(sel_cs_g).empty()) {
              char m[48];
              snprintf(m, sizeof(m), "DOWNLOADING MAP %d/%d  %u KB",
                       radar_bg::g_maps_progress, radar_bg::g_maps_total,
                       (unsigned) (radar_bg::g_maps_bytes / 1024));
              lv_label_set_text(id(sel_route_l), m);
            } else if (was_busy && !busy && id(sel_cs_g).empty()) {
              lv_label_set_text(id(sel_route_l), "");   // 抓完就清掉
            }
            was_busy = busy;
          }
          if (radar_bg::g_maps_ready) {
            xSemaphoreTake(radar_bg::mtx(), portMAX_DELAY);
            radar_bg::g_maps_ready = false;
            xSemaphoreGive(radar_bg::mtx());
            id(maps_key) = id(maps_key_try);   // 只有成功才算數
            // 載入在主迴圈做,不在背景 task —— 繪製程式碼直接讀 maptiles 的
            // vector,在 task 裡改會與繪製打架。
            maptiles::load_from_partition();
            id(rebuild_base).execute();   // generation 已變,快取自然失效
          }
          if (radar_bg::g_route_ready) {
            xSemaphoreTake(radar_bg::mtx(), portMAX_DELAY);
            radar_bg::g_route_ready = false;
            if (!id(info_on))
              lv_label_set_text(id(sel_route_l), radar_bg::g_route.c_str());
            xSemaphoreGive(radar_bg::mtx());
          }
          // 在地天氣:開機 8 秒後首抓,之後每 10 分鐘;座標變更時 wx_last_ms 歸零強制重抓
          if (millis() > 8000 && wifi::global_wifi_component->is_connected() &&
              (id(wx_last_ms) == 0 || millis() - id(wx_last_ms) > 600000)) {
            id(wx_last_ms) = millis();
            radar_bg::request_weather(id(home_lat).state, id(home_lon).state);
          }
          if (radar_bg::g_wx_ready) {
            xSemaphoreTake(radar_bg::mtx(), portMAX_DELAY);
            radar_bg::g_wx_ready = false;
            xSemaphoreGive(radar_bg::mtx());
            if (id(sel_cs_g).empty())
              id(show_weather).execute();
          }
          if (!radar_bg::g_states_ready) return;
          xSemaphoreTake(radar_bg::mtx(), portMAX_DELAY);
          int n = radar_bg::g_result.size();
          // ATC 軌跡尾跡:資料被覆寫前,依呼號比對舊位置,推入 trail 歷史(0=最新,2=最舊)
          if (id(trail_lat).size() != AC_SLOTS * 3) id(trail_lat).assign(AC_SLOTS * 3, NAN);
          if (id(trail_lon).size() != AC_SLOTS * 3) id(trail_lon).assign(AC_SLOTS * 3, NAN);
          if (id(trail_cs).size() != AC_SLOTS) id(trail_cs).assign(AC_SLOTS, "");
          {
            int lim = n < AC_SLOTS ? n : AC_SLOTS;
            for (int j = 0; j < lim; j++) {
              const std::string &cs = radar_bg::g_result[j].cs;
              int base = j * 3;
              if (id(trail_cs)[j] != cs) {   // 這格換機了:舊歷史屬於前任,全部作廢
                id(trail_cs)[j] = cs;
                for (int k = 0; k < 3; k++) { id(trail_lat)[base + k] = NAN; id(trail_lon)[base + k] = NAN; }
              }
              int oi = -1;
              for (int k = 0; k < (int) id(ac_cs).size(); k++)
                if (id(ac_cs)[k] == cs) { oi = k; break; }
              if (oi < 0) continue;   // 新出現的機,還沒有歷史
              id(trail_lat)[base + 2] = id(trail_lat)[base + 1];
              id(trail_lon)[base + 2] = id(trail_lon)[base + 1];
              id(trail_lat)[base + 1] = id(trail_lat)[base];
              id(trail_lon)[base + 1] = id(trail_lon)[base];
              id(trail_lat)[base] = id(ac_lat)[oi];
              id(trail_lon)[base] = id(ac_lon)[oi];
            }
          }
          id(ac_lat).clear(); id(ac_lon).clear(); id(ac_trk).clear();
          id(ac_vel).clear(); id(ac_alt).clear(); id(ac_cs).clear(); id(ac_vr).clear();
          id(ac_lc).clear(); id(ac_sq).clear(); id(ac_ty).clear();
          id(ac_reg).clear(); id(ac_desc).clear(); id(ac_cat).clear(); id(ac_hex).clear();
          for (auto &ac : radar_bg::g_result) {
            id(ac_reg).push_back(ac.reg); id(ac_desc).push_back(ac.desc);
            id(ac_cat).push_back(ac.cat); id(ac_hex).push_back(ac.hex);
            id(ac_lat).push_back(ac.lat); id(ac_lon).push_back(ac.lon);
            id(ac_trk).push_back(ac.trk); id(ac_vel).push_back(ac.vel);
            id(ac_alt).push_back(ac.alt); id(ac_cs).push_back(ac.cs);
            id(ac_vr).push_back(ac.vr); id(ac_lc).push_back(ac.lc);
            id(ac_sq).push_back(ac.sq); id(ac_ty).push_back(ac.ty);
          }
          radar_bg::g_states_ready = false;
          xSemaphoreGive(radar_bg::mtx());
          id(fetch_ms) = millis();
          // 選取中航班的詳情刷新(系統資訊顯示中則不覆蓋)
          if (!id(sel_cs_g).empty() && !id(info_on)) {
            int si = -1;
            for (int i = 0; i < n; i++)
              if (id(ac_cs)[i] == id(sel_cs_g)) { si = i; break; }
            char b2[48];
            if (si >= 0) {
              float lat0 = id(home_lat).state, lon0 = id(home_lon).state;
              float coslat = cosf(lat0 * 3.14159265f / 180.0f);
              float e2 = (id(ac_lon)[si] - lon0) * 111.320f * coslat;
              float n2 = (id(ac_lat)[si] - lat0) * 110.574f;
              float brg = atan2f(e2, n2) * 57.29578f;
              if (brg < 0) brg += 360.0f;
              snprintf(b2, sizeof(b2), id(units_imperial) ? "ALT %5.0f ft    FL %03.0f" : "ALT %5.0f m     FL %03.0f",
                       id(ac_alt)[si] * (id(units_imperial) ? 3.2808f : 1.0f), id(ac_alt)[si] * 0.032808f);
              lv_label_set_text(id(sel_l1), b2);
              snprintf(b2, sizeof(b2), id(units_imperial) ? "SPD %5.0f mph   %3.0f kt" : "SPD %5.0f km/h  %3.0f kt",
                       id(ac_vel)[si] * (id(units_imperial) ? 2.2369f : 3.6f), id(ac_vel)[si] * 1.9438f);
              lv_label_set_text(id(sel_l2), b2);
              snprintf(b2, sizeof(b2), id(units_imperial) ? "VS  %+5.0f fpm   TRK %03.0f"
                                                          : "VS   %+02.1f m/s   TRK %03.0f",
                       id(ac_vr)[si] * (id(units_imperial) ? 196.85f : 1.0f), id(ac_trk)[si]);
              lv_label_set_text(id(sel_l3), b2);
              snprintf(b2, sizeof(b2), id(units_imperial) ? "DIST %4.0f mi    BRG %03.0f" : "DIST %4.0f km    BRG %03.0f",
                       sqrtf(e2 * e2 + n2 * n2) * (id(units_imperial) ? 0.6214f : 1.0f), brg);
              lv_label_set_text(id(sel_l4), b2);
              radar_sq_line(id(sel_l5), id(ac_sq)[si].c_str());
              // 機型每輪都要重補:向量剛才被新的 states 重建過(OpenSky 來源為空)
              radar_bg::type_fill(id(ac_ty)[si], id(ac_reg)[si], id(ac_desc)[si], id(ac_hex)[si]);
              radar_type_badge(id(sel_type_l), id(ac_ty)[si].c_str());
              // 規格面板開著就一併刷新:機型碼可能後補上來,單位也可能在設定頁被改過
              if (id(spec_on))
                radar_fill_spec(id(spec_img), id(spec_l0), id(spec_l1), id(spec_l2),
                                id(spec_l3), id(spec_l4), id(spec_l5), id(spec_l6),
                                id(spec_l7),
                                id(ac_ty)[si].c_str(), id(ac_reg)[si].c_str(),
                                id(ac_desc)[si].c_str(), id(ac_cat)[si].c_str(),
                                id(ac_hex)[si], id(ac_cs)[si].c_str(),
                                id(units_imperial));
            } else {
              id(spec_on) = false;   // 飛出範圍 → 徽章消失,規格面板不能留著沒法關
              lv_obj_add_flag(id(spec_panel), LV_OBJ_FLAG_HIDDEN);
              lv_label_set_text(id(sel_l1), "(out of range)");
              lv_label_set_text(id(sel_l2), "");
              lv_label_set_text(id(sel_l3), "");
              lv_label_set_text(id(sel_l4), "");
              lv_label_set_text(id(sel_l5), "");
              radar_type_badge(id(sel_type_l), "");   // 隱藏機型徽章
            }
          }
          char b[64];
          // 狀態列出處標籤(MERGE/FI/LOL/LIVE);OpenSky 不掛後綴省寬度
          char stag_buf[14] = "";
          if (radar_bg::g_last_src > 0)
            snprintf(stag_buf, sizeof(stag_buf), " [%s]", radar_bg::src_name(radar_bg::g_last_src));
          const char *stag = stag_buf;
          auto t = id(rtc_time).now();
          // 狀態列在 800x480 只有 ~26 個等寬字的寬度:原本的 "AC:n   UPD hh:mm:ss  [A.LIVE]"
          // (29 字)會被螢幕右緣切掉,所以拿掉 UPD 與多餘空白(時間本身就看得懂)。
          // AC 用裁切前的架數;畫面仍只畫 AC_SLOTS。
          int n_ac = radar_bg::g_fetched_n;
          if (t.is_valid())
            snprintf(b, sizeof(b), "AC:%d  %02d:%02d:%02d%s", n_ac, t.hour, t.minute, t.second, stag);
          else
            snprintf(b, sizeof(b), "AC:%d%s", n_ac, stag);
          lv_label_set_text(id(status_label), b);
          static bool first_data = true;
          if (first_data) {
            first_data = false;
            if (id(sel_cs_g).empty())
              id(show_weather).execute();   // 未選機:面板顯示在地天氣
          }
      # 航班點外插移動(每秒,依航向+地速推算目前位置)
      - lambda: |-
          #ifdef RADAR_NO_ALARM
          // Tab5:外插 2s 一拍,减轻与音频/触控争用
          static uint8_t ac_div;
          if ((++ac_div) & 1) return;
          #endif
          lv_obj_t *marks[AC_SLOTS] = {
            id(ac0), id(ac1), id(ac2), id(ac3), id(ac4), id(ac5), id(ac6), id(ac7),
            id(ac8), id(ac9), id(ac10), id(ac11), id(ac12), id(ac13), id(ac14), id(ac15),
            id(ac16), id(ac17), id(ac18), id(ac19), id(ac20), id(ac21), id(ac22), id(ac23),
            id(ac24), id(ac25), id(ac26), id(ac27), id(ac28), id(ac29), id(ac30), id(ac31),
            id(ac32), id(ac33), id(ac34), id(ac35), id(ac36), id(ac37), id(ac38), id(ac39)
          };
          lv_obj_t *imgs[AC_SLOTS] = {
            (lv_obj_t *) id(ai0), (lv_obj_t *) id(ai1), (lv_obj_t *) id(ai2), (lv_obj_t *) id(ai3), (lv_obj_t *) id(ai4), (lv_obj_t *) id(ai5), (lv_obj_t *) id(ai6), (lv_obj_t *) id(ai7),
            (lv_obj_t *) id(ai8), (lv_obj_t *) id(ai9), (lv_obj_t *) id(ai10), (lv_obj_t *) id(ai11), (lv_obj_t *) id(ai12), (lv_obj_t *) id(ai13), (lv_obj_t *) id(ai14), (lv_obj_t *) id(ai15),
            (lv_obj_t *) id(ai16), (lv_obj_t *) id(ai17), (lv_obj_t *) id(ai18), (lv_obj_t *) id(ai19), (lv_obj_t *) id(ai20), (lv_obj_t *) id(ai21), (lv_obj_t *) id(ai22), (lv_obj_t *) id(ai23),
            (lv_obj_t *) id(ai24), (lv_obj_t *) id(ai25), (lv_obj_t *) id(ai26), (lv_obj_t *) id(ai27), (lv_obj_t *) id(ai28), (lv_obj_t *) id(ai29), (lv_obj_t *) id(ai30), (lv_obj_t *) id(ai31),
            (lv_obj_t *) id(ai32), (lv_obj_t *) id(ai33), (lv_obj_t *) id(ai34), (lv_obj_t *) id(ai35), (lv_obj_t *) id(ai36), (lv_obj_t *) id(ai37), (lv_obj_t *) id(ai38), (lv_obj_t *) id(ai39)
          };
          lv_obj_t *dbs[AC_SLOTS] = {
            id(ad0), id(ad1), id(ad2), id(ad3), id(ad4), id(ad5), id(ad6), id(ad7),
            id(ad8), id(ad9), id(ad10), id(ad11), id(ad12), id(ad13), id(ad14), id(ad15),
            id(ad16), id(ad17), id(ad18), id(ad19), id(ad20), id(ad21), id(ad22), id(ad23),
            id(ad24), id(ad25), id(ad26), id(ad27), id(ad28), id(ad29), id(ad30), id(ad31),
            id(ad32), id(ad33), id(ad34), id(ad35), id(ad36), id(ad37), id(ad38), id(ad39)
